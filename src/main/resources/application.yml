spring:
  application:
    name: eventos-guia
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  rabbit:
    exchange: guia.eventos
    routing-key: guia.estado

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
